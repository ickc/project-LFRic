[project]
authors = [{name = "Kolen Cheung", email = "10970208+ickc@users.noreply.github.com"}]
dependencies = []
description = "A tour of modern Fortran for a Python/HPC programmer, aimed at reading LFRic"
name = "fortran_tour"
requires-python = ">= 3.11"
version = "0.1.0"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "linux-aarch64", "osx-64", "osx-arm64"]

[tool.pixi.pypi-dependencies]
fortran_tour = { path = ".", editable = true }

[tool.pixi.dependencies]
# Toolchain: gfortran drives every `%%fortran` cell in the notebook.
gfortran = ">=13"
make = "*"
# Notebook stack.
python = ">=3.11"
ipykernel = ">=6.29"
jupyterlab = ">=4.2"
jupytext = ">=1.16"
nbclient = ">=0.10"
numpy = ">=2.0"

# Optional: LFortran ships an `xeus` Jupyter kernel called "Fortran". It is not
# what the notebook uses (see §0 for why), but it is here so the claims in §0
# can be checked, and for `lfortran --show-asr`, which is a nice way to see how
# a compiler resolves Fortran semantics. conda-forge has no linux-aarch64 build,
# hence the per-platform scoping rather than a plain dependency.
[tool.pixi.target.linux-64.dependencies]
lfortran = ">=0.60"

[tool.pixi.target.osx-64.dependencies]
lfortran = ">=0.60"

[tool.pixi.target.osx-arm64.dependencies]
lfortran = ">=0.60"

[tool.pixi.tasks.lab]
cmd = "jupyter lab"
description = "Open JupyterLab (use the 'Python (fortran_tour)' kernel)"

[tool.pixi.tasks.kernel]
cmd = """
python -m ipykernel install --user
  --name fortran_tour
  --display-name 'Python (fortran_tour)'
"""
description = "Register the notebook kernel with the user's Jupyter"

[tool.pixi.tasks.sync]
cmd = "jupytext --sync index.ipynb"
description = "Sync index.ipynb <-> _pair/index.py via jupytext"

[tool.pixi.tasks.execute]
cmd = "jupytext --sync index.ipynb && jupyter execute --kernel_name=python3 --inplace index.ipynb"
description = "Re-run the notebook in place, refreshing the stored outputs Quarto renders"

[tool.pixi.tasks.demo]
cmd = "make -C demo"
description = "Build the standalone example programs in demo/"

[tool.pixi.tasks.demo-clean]
cmd = "make -C demo clean"
description = "Remove demo/ build products"

# Notebook <-> text pairing.
#
# The .ipynb is the file Quarto renders (it carries the stored outputs, so the
# top-level `pixi run build` never needs a Fortran toolchain).  The paired .py
# is the reviewable, diffable source.  It lives under `_pair/` because Quarto
# skips any path component starting with `_`, so the pair is invisible to the
# site build and cannot be mistaken for a second copy of the page.
[tool.jupytext]
formats = "ipynb,_pair//py:percent"
