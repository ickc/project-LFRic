[project]
authors = [{name = "Kolen Cheung", email = "10970208+ickc@users.noreply.github.com"}]
dependencies = []
description = "A tour of modern Fortran for a Python/HPC programmer, aimed at reading LFRic"
name = "fortran_tour"
requires-python = ">= 3.11"
version = "0.1.0"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "linux-aarch64", "osx-64", "osx-arm64"]

[tool.pixi.pypi-dependencies]
fortran_tour = { path = ".", editable = true }

[tool.pixi.dependencies]
# Toolchain: gfortran drives every `%%fortran` cell in the notebook.
gfortran = ">=13"
make = "*"
# Notebook stack. No Jupyter *frontend* here: the notebook is opened from a
# JupyterLab installed elsewhere, which reaches into this environment via
# `pixi-kernel` -- so all that is needed on this side is `ipykernel` for the
# kernel itself and `nbclient` for the headless re-run below.
python = ">=3.11"
ipykernel = ">=6.29"
jupytext = ">=1.16"
nbclient = ">=0.10"
numpy = ">=2.0"

# Single-line commands on purpose: pixi's task shell treats a newline as a
# command separator, so a TOML multi-line string silently splits into pieces.
[tool.pixi.tasks.sync]
cmd = "jupytext --sync index.ipynb"
description = "Reconcile index.ipynb <-> _pair/index.md via jupytext"

# `--kernel_name=python3` overrides the notebook's recorded kernelspec, which
# names `pixi-kernel-python3` -- a kernel that exists in the JupyterLab this
# notebook is edited from, not in this environment. nbclient only ever reads
# that field, so the override does not rewrite it.
[tool.pixi.tasks.execute]
depends-on = ["sync"]
cmd = "jupyter execute --kernel_name=python3 --inplace index.ipynb && python -m fortran_tour.nbclean index.ipynb && jupytext --sync index.ipynb"
description = "Re-run the notebook in place, refreshing the stored outputs Quarto renders"

[tool.pixi.tasks.demo]
cmd = "make -C demo"
description = "Build the standalone example programs in demo/"

[tool.pixi.tasks.demo-clean]
cmd = "make -C demo clean"
description = "Remove demo/ build products"

# Notebook <-> text pairing.
#
# The .ipynb is the file Quarto renders: it carries the stored outputs, so the
# top-level `pixi run build` never needs a Fortran toolchain.  The paired .md
# is the reviewable, diffable source, and the one to edit.
#
# Markdown rather than py:percent because the page is four-fifths prose, which
# in py:percent would arrive as a thousand lines of `# ` comments.  Markdown
# round-trips this document verbatim, fenced Fortran blocks inside markdown
# cells included (md:myst does not -- it drops trailing newlines).
#
# `_pair/` because Quarto skips any path component starting with `_`, so the
# pair stays out of the site build and cannot be mistaken for a second copy of
# the page.
#
# `comment_magics = false` because otherwise jupytext escapes `%%fortran` to
# `# %%fortran` on the way out, and the round trip back to .ipynb yields cells
# that are Python syntax errors.
[tool.jupytext]
formats = "ipynb,_pair//md"
comment_magics = false
